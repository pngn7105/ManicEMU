name: Build Rit faelease IPA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    env:
      UPLOAD_IPA: ${{ vars.UPLOAD_IPA || 'true' }}

    steps:
      - name: 1. Fetch Source Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: 2. Restore Oversized Vendored Core
        run: |
          cat Cores/mame.libretro.framework/mame.libretro.part.* \
            > Cores/mame.libretro.framework/mame.libretro
          echo "ede8b95b25fe4351d3e8b8ecc1398e589459d84b68650dfbda535c54f697638b  Cores/mame.libretro.framework/mame.libretro" \
            | shasum -a 256 -c -
          chmod +x Cores/mame.libretro.framework/mame.libretro
          rm Cores/mame.libretro.framework/mame.libretro.part.*

      - name: 3. Configure Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: 4. Install build dependencies
        run: |
          set -euxo pipefail
          brew update
          brew install boost

      - name: 4.1 Install Vulkan SDK via VulkanCI Action
        id: vulkanci
        uses: NcStudios/VulkanCI@v1.0
        continue-on-error: true
        with:
          # VulkanSDK version to use (must be supported)
          sdkVersion: 1.4.309.0

          # Optional path to installation path (example: 'myArtifacts')
          installPath: 'myArtifacts'

      - name: 4.2 VulkanCI fallback: log runner info and try manual install
        if: ${{ steps.vulkanci.outcome != 'success' }}
        run: |
          echo "VulkanCI action failed; logging runner info and attempting manual install"
          uname -a || true
          sw_vers || true
          echo "Listing workspace and temp dirs for debugging:"
          ls -la "$GITHUB_WORKSPACE" || true
          ls -la "$RUNNER_TEMP" || true
          git clone --depth 1 https://github.com/NcStudios/VulkanCI.git "$RUNNER_TEMP/VulkanCI"
          if [ -f "$RUNNER_TEMP/VulkanCI/ci/vulkansdk-macos.sh" ]; then
            bash "$RUNNER_TEMP/VulkanCI/ci/vulkansdk-macos.sh" 1.4.309.0
          elif [ -f "$RUNNER_TEMP/VulkanCI/install.sh" ]; then
            bash "$RUNNER_TEMP/VulkanCI/install.sh" 1.4.309.0
          elif [ -f "$RUNNER_TEMP/VulkanCI/scripts/install_vulkansdk.sh" ]; then
            bash "$RUNNER_TEMP/VulkanCI/scripts/install_vulkansdk.sh" 1.4.309.0
          else
            echo "Manual installer not found; listing repo for debug:"
            ls -la "$RUNNER_TEMP/VulkanCI"
            exit 1
          fi

      - name: 5. Compile Release Build
        run: |
          xcodebuild \
            -project ManicEmu/ManicEmu.xcodeproj \
            -scheme "ManicEmuRelease" \
            -configuration SideloadRelease \
            -derivedDataPath "$RUNNER_TEMP/ManicEmuDerivedData" \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: 6. Package .app into .ipa
        env:
          APP_PATH: ${{ runner.temp }}/ManicEmuDerivedData/Build/Products/Release-iphoneos/ManicEmu.app
          IPA_PATH: ${{ runner.temp }}/ManicEmuSideloadRelease.ipa
        run: |
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Payload" "$IPA_PATH"

      - name: 7. Store IPA as Workflow Artifact
        if: env.UPLOAD_IPA == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ManicEmu-SideloadRelease.ipa
          path: ${{ runner.temp }}/ManicEmuSideloadRelease.ipa
          retention-days: 90
          if-no-files-found: error
